model:
  backbone: ems_resnet34
  T: 4
  decay: 0.25
  num_classes: 80
  num_anchors: 3
  anchors:
    - [[15, 22], [35, 42], [57, 89]]      # P4/stride=16  — YOLOv3 416px anchors ×(640/416)
    - [[125, 126], [208, 260], [529, 491]] # P5/stride=32
  strides: [16, 32]

data:
  img_size: 640
  num_workers: 8
  pin_memory: true

train:
  epochs: 300
  batch_size: 8        # 32 GB VRAM; T=4 at 640px peaks ~22-26 GB — if OOM drop to 6
  lr0: 2.0e-2          # 1e-2 × (128/64); eff. batch = 8 GPUs × 8 × accum 2 = 128
  lrf: 0.1
  momentum: 0.937
  weight_decay: 5.0e-4
  warmup_epochs: 3
  accum_steps: 2
  amp: true
  compile: true
  eval_every: 5
  save_every: 10
  close_mosaic: 10

wandb:
  entity: adela-greganova-tu-delft
  project: COCO-runs
  name: coco-resnet34-t4-640-8gpu
